name: Grab OCI A1 for Core Keeper

on:
  schedule:
    - cron: "23 * * * *"   # hourly
  workflow_dispatch:

concurrency:
  group: grab
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPPRESS_LABEL_WARNING: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/grab.yml

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI config
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: python scripts/write_config.py

      - name: Try to launch VM
        id: grab
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: bash scripts/grab.sh

      # Public repo: logs are public, so no IP / Game ID / keys are printed here.
      - name: Wait for server to start
        if: steps.grab.outputs.status == 'launched'
        continue-on-error: true
        run: |
          oci compute instance get --instance-id "$(cat instance_id)" --wait-for-state RUNNING --max-wait-seconds 900 >/dev/null
          {
            echo "## Core Keeper server launched (${{ steps.grab.outputs.shape }})"
            echo "Check the public IP in the OCI console, then SSH with your own key to read the Game ID."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disable this workflow (job done)
        if: always() && (steps.grab.outputs.status == 'launched' || steps.grab.outputs.status == 'exists')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable grab.yml --repo "${{ github.repository }}"

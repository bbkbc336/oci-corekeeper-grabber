name: Grab OCI A1 for Core Keeper

# Each run keeps retrying for ~5.5 hours, then re-dispatches itself
# (workflow_dispatch from GITHUB_TOKEN is allowed), so no cron is needed.
# The hourly cron is only a backup in case the chain breaks.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: grab
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPPRESS_LABEL_WARNING: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/grab.yml

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI config
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: python scripts/write_config.py

      - name: Keep trying to launch VM (~5.5 h)
        id: grab
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          MAX_MINUTES: "325"
          PAUSE_SECONDS: "120"
        run: bash scripts/loop.sh

      # Public repo: logs are public, so no IP / Game ID / keys are printed here.
      - name: Wait for server to start
        if: steps.grab.outputs.status == 'launched'
        continue-on-error: true
        run: |
          oci compute instance get --instance-id "$(cat instance_id)" --wait-for-state RUNNING --max-wait-seconds 900 >/dev/null
          {
            echo "## Core Keeper server launched (${{ steps.grab.outputs.shape }})"
            echo "Check the public IP in the OCI console, then SSH with your own key to read the Game ID."
          } >> "$GITHUB_STEP_SUMMARY"

      # Opens an issue so GitHub emails/notifies the owner. No IP or keys in it (public repo).
      - name: Notify owner (GitHub issue)
        if: always() && steps.grab.outputs.status == 'launched'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues" \
            -f title="Core Keeper server launched (${{ steps.grab.outputs.shape }})" \
            -f body="The OCI A1 VM was created and this workflow has been disabled. Check the public IP in the OCI console / mobile app, then SSH with your own key." >/dev/null

      - name: Disable this workflow (job done)
        if: always() && (steps.grab.outputs.status == 'launched' || steps.grab.outputs.status == 'exists')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/grab.yml/disable"

      - name: Start next round
        if: always() && steps.grab.outputs.status == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/grab.yml/dispatches" -f ref="${{ github.ref_name }}"

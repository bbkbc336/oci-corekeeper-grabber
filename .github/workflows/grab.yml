name: Grab OCI A1 for Core Keeper

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (keeps private-repo minutes under the free 2,000/month)
  workflow_dispatch:

concurrency:
  group: grab
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/grab.yml

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI config
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: python scripts/write_config.py

      - name: Try to launch VM
        id: grab
        run: bash scripts/grab.sh

      - name: Save SSH key (download from this run's Artifacts)
        if: steps.grab.outputs.status == 'launched'
        uses: actions/upload-artifact@v4
        with:
          name: corekeeper-ssh-key
          path: |
            ck_ssh
            ck_ssh.pub
          retention-days: 90

      - name: Wait for server and read Game ID
        if: steps.grab.outputs.status == 'launched'
        run: |
          ID=$(cat instance_id)
          oci compute instance get --instance-id "$ID" --wait-for-state RUNNING --max-wait-seconds 900 >/dev/null
          IP=$(oci compute instance list-vnics --instance-id "$ID" --query 'data[0]."public-ip"' --raw-output)
          echo "Public IP: $IP"
          SSH="ssh -i ck_ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@$IP"
          GID=""
          for i in $(seq 1 60); do
            GID=$($SSH "sudo docker exec core-keeper-dedicated cat /home/steam/core-keeper-dedicated/GameID.txt" 2>/dev/null || true)
            [ -n "$GID" ] && break
            sleep 30
          done
          {
            echo "## Core Keeper server launched"
            echo "- Shape: ${{ steps.grab.outputs.shape }}"
            echo "- Public IP: \`$IP\`"
            echo "- Game ID: \`${GID:-not ready yet - check again later}\`"
            echo "- SSH key: download the corekeeper-ssh-key artifact from this run"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disable this workflow (job done)
        if: steps.grab.outputs.status == 'launched' || steps.grab.outputs.status == 'exists'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable grab.yml --repo "${{ github.repository }}"
